name: BoomNode Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

jobs:
  build:
    name: Сборка
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
            ext: .exe
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -o boomnode-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} ./cmd/boomnode

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: boomnode-${{ matrix.goos }}-${{ matrix.goarch }}
          path: boomnode-*
