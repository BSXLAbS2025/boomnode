name: BoomNode CI/CD

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  check:
    name: Проверка кода
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Download dependencies
        run: go mod download

      - name: Проверка форматирования (go fmt)
        run: test -z $(gofmt -l .) || (echo "Ошибка: код не отформатирован. Запусти gofmt -w ." && exit 1)

      - name: Статический анализ (go vet)
        run: go vet ./...

      - name: Запуск тестов
        run: go test ./... -v

  build:
    name: Сборка
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
            ext: .exe
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -o boomnode-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} ./cmd/boomnode

      - name: Upload Artifact to Release
        uses: softprops/action-gh-release@v2
        with:
          files: boomnode-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
